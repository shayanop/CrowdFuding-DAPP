services:
  - type: web
    name: crowdfunding-dapp
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_KYC_ADDRESS
        sync: false
      - key: VITE_CROWDFUND_ADDRESS
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
